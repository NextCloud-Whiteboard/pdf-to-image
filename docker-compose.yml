services:
  pdf-api:
    build: .
    image: pdf-to-image-pdf-api
    container_name: pdf-api
    restart: unless-stopped
    ports:
      - "3005:5000"
    healthcheck:
      # python:3.11-slim has no curl/wget, so probe /health via stdlib urllib.
      # 200 -> healthy; 503 (poppler missing) or a connection error -> unhealthy.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - nextcloud

networks:
  # Shared with the nextcloud + nginx-proxy-manager containers. This is what
  # lets the proxy reach the service as `pdf-api:5000` (pdf2img.loket.site).
  # Must already exist (created by the nextcloud compose project).
  nextcloud:
    external: true
    name: nextcloud_default
